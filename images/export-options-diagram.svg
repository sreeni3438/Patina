<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f5f5f5"/>

  <!-- Folder Structure -->
  <g transform="translate(100, 80)">
    <!-- Root folder: .claude -->
    <rect x="0" y="0" width="32" height="24" rx="2" fill="#0099ff" opacity="0.2"/>
    <text x="40" y="18" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#1e1e1e">.claude/</text>

    <!-- skills folder -->
    <rect x="20" y="50" width="32" height="24" rx="2" fill="#0099ff" opacity="0.2"/>
    <text x="60" y="68" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#1e1e1e">skills/</text>

    <!-- Component library skill folder -->
    <rect x="40" y="100" width="32" height="24" rx="2" fill="#0099ff" opacity="0.3"/>
    <text x="80" y="118" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#1e1e1e">simple-ai-design-system/</text>

    <!-- Files inside skill -->
    <!-- description.md -->
    <circle cx="52" cy="158" r="4" fill="#f36235"/>
    <text x="65" y="163" font-family="'Inter', sans-serif" font-size="14" fill="#555">description.md</text>

    <!-- index.md -->
    <circle cx="52" cy="200" r="4" fill="#f36235"/>
    <text x="65" y="205" font-family="'Inter', sans-serif" font-size="14" fill="#555">index.md</text>

    <!-- tokens.json -->
    <circle cx="52" cy="242" r="4" fill="#f36235"/>
    <text x="65" y="247" font-family="'Inter', sans-serif" font-size="14" fill="#555">tokens.json</text>

    <!-- components/ subdirectory -->
    <rect x="40" y="280" width="32" height="24" rx="2" fill="#0099ff" opacity="0.2"/>
    <text x="80" y="298" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#1e1e1e">components/</text>

    <!-- Component files -->
    <circle cx="70" cy="330" r="3" fill="#7a7a7a"/>
    <text x="80" y="334" font-family="'Inter', sans-serif" font-size="13" fill="#7a7a7a">Button.md</text>

    <circle cx="70" cy="360" r="3" fill="#7a7a7a"/>
    <text x="80" y="364" font-family="'Inter', sans-serif" font-size="13" fill="#7a7a7a">Input.md</text>

    <circle cx="70" cy="390" r="3" fill="#7a7a7a"/>
    <text x="80" y="394" font-family="'Inter', sans-serif" font-size="13" fill="#7a7a7a">Card.md</text>

    <!-- Lines connecting structure -->
    <line x1="20" y1="12" x2="20" y2="50" stroke="#bfbfbf" stroke-width="1"/>
    <line x1="20" y1="50" x2="40" y2="50" stroke="#bfbfbf" stroke-width="1"/>
    <line x1="40" y1="50" x2="40" y2="112" stroke="#bfbfbf" stroke-width="1"/>
    <line x1="40" y1="112" x2="60" y2="112" stroke="#bfbfbf" stroke-width="1"/>

    <!-- Lines to files -->
    <line x1="60" y1="124" x2="60" y2="330" stroke="#bfbfbf" stroke-width="1"/>
    <line x1="52" y1="158" x2="60" y2="158" stroke="#bfbfbf" stroke-width="1"/>
    <line x1="52" y1="200" x2="60" y2="200" stroke="#bfbfbf" stroke-width="1"/>
    <line x1="52" y1="242" x2="60" y2="242" stroke="#bfbfbf" stroke-width="1"/>
    <line x1="60" y1="292" x2="70" y2="292" stroke="#bfbfbf" stroke-width="1"/>
    <line x1="70" y1="292" x2="70" y2="330" stroke="#bfbfbf" stroke-width="1"/>
    <line x1="70" y1="330" x2="80" y2="330" stroke="#bfbfbf" stroke-width="1"/>
    <line x1="70" y1="360" x2="80" y2="360" stroke="#bfbfbf" stroke-width="1"/>
    <line x1="70" y1="390" x2="80" y2="390" stroke="#bfbfbf" stroke-width="1"/>
  </g>

  <!-- Bottom label -->
  <text x="50%" y="570" font-family="'Inter', sans-serif" font-size="14" fill="#7a7a7a" text-anchor="middle" font-weight="400">Seamlessly integrated into Claude's design system</text>
</svg>