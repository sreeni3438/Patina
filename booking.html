<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patina — Book a Call</title>
  <meta name="description" content="Book a call with Patina, the embedded design partner for venture portfolios.">
  <link rel="icon" type="image/png" href="images/logo/favicon-light.png" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/png" href="images/logo/favicon-dark.png" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-dark:   #1e1e1e;
      --c-mid:    #7a7a7a;
      --c-muted:  #5a6271;
      --c-border: #bfbfbf;
      --c-orange: #f36235;
      --c-blue:   #0099ff;
      --c-footer: #f7f9fc;
      --f-inter:  'Public Sans', sans-serif;
      --f-geist:  'Public Sans', sans-serif;
      --f-instrument: 'Public Sans', sans-serif;
      --nav-h: 56px;
      --gutter: 48px;
    }

    html { scroll-behavior: smooth; scrollbar-gutter: stable; cursor: none !important; }
    body { cursor: none !important; }
    *, *::before, *::after { cursor: none !important; }

    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 12px;
      height: 12px;
      background: #111;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 99999;
      transition: transform 0.08s ease, background 0.15s ease;
    }
    #custom-cursor.on-dark { background: #fff; }

    body {
      font-family: var(--f-instrument);
      color: var(--c-dark);
      background: #fff;
      overflow-x: hidden;
      max-width: 100vw;
      padding: 0 var(--gutter);
    }

    a { color: inherit; text-decoration: none; }
    img { display: block; }
    ul, ol { list-style: none; }

    /* ─── PAGE TRANSITION ────────────────────────────── */
    body { animation: pageFadeIn 0.3s ease-out forwards; }
    body.fade-out { opacity: 0; transition: opacity 0.25s ease; }
    @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* ─── ENTRANCE ANIMATIONS ───────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ─── SCROLL REVEAL ─────────────────────────────── */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1) var(--reveal-delay, 0s),
                  transform 0.9s cubic-bezier(0.16, 1, 0.3, 1) var(--reveal-delay, 0s);
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* ─── PAGE CONTAINER ─────────────────────────────── */
    .page {
      max-width: 1728px;
      margin: 0 auto;
      width: 100%;
      position: relative;
    }

    footer { position: relative; }
    footer::before, footer::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(255, 255, 255, 0.22);
      pointer-events: none;
      z-index: 5;
    }
    footer::before { left: var(--gutter); }
    footer::after  { right: var(--gutter); }

    /* ─── BUTTON ─────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--c-dark);
      color: #fff;
      border-radius: 0;
      font-family: var(--f-instrument);
      font-weight: 200;
      font-size: 16.4px;
      letter-spacing: -0.352px;
      white-space: nowrap;
      cursor: pointer;
      border: none;
      padding: 0 16px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .btn:hover { opacity: 0.82; transform: scale(1.04); }
    .btn img, .btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .btn-lg { padding: 12px 20px; }
    .btn-sm { padding: 12px 20px; }

    .nav .btn {
      font-size: 16px;
      padding: 9px 16px;
      border-radius: 0;
      gap: 7px;
    }
    .nav .btn img, .nav .btn svg { width: 15px; height: 15px; }

    /* ─── NAVBAR ─────────────────────────────────────── */
    .nav {
      position: fixed;
      inset: 0 0 auto;
      z-index: 200;
      background: #fff;
      border-bottom: 1px solid #e2e2e2;
    }

    .nav-inner {
      max-width: 1728px;
      margin: 0 auto;
      padding: 14px 32px 18px;
      display: flex;
      align-items: center;
    }

    .nav-logo img { height: 23.8px; width: auto; }

    /* ─── SURVEY HERO ────────────────────────────────── */
    .survey {
      min-height: calc(100vh - var(--nav-h));
      margin-top: var(--nav-h);
      padding: 80px calc(var(--gutter) + 65px) 120px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .survey-head {
      font-family: var(--f-instrument);
      font-size: 68px;
      font-weight: 400;
      line-height: 80px;
      letter-spacing: -0.9px;
      max-width: 920px;
      margin-bottom: 20px;
    }
    .survey-head .outline {
      color: transparent;
      -webkit-text-stroke: 1px var(--c-dark);
      text-stroke: 1px var(--c-dark);
    }
    .survey-sub {
      font-size: 22px;
      font-weight: 200;
      line-height: 32px;
      color: #555;
      max-width: 720px;
      margin-bottom: 56px;
    }
    .survey-embed {
      width: 100%;
      max-width: 900px;
    }
    .survey-embed iframe {
      display: block;
      width: 100%;
      min-height: 900px;
      border: none;
    }

    /* ─── FOOTER ─────────────────────────────────────── */
    footer {
      height: 476px;
      background: #0f0f0f;
      color: #fff;
      overflow: hidden;
      width: 100vw;
      position: relative;
      left: 50%;
      right: 50%;
      margin-left: -50vw;
      margin-right: -50vw;
      border-top: 1px solid rgba(255, 255, 255, 0.22);
    }
    .footer-logo img { filter: brightness(0) invert(1); }
    .footer-inner {
      height: 100%;
      padding: 40px calc(var(--gutter) + 65px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .footer-logo img { height: 23.8px; width: auto; }
    .footer-blurb {
      font-size: 29.6px;
      font-weight: 200;
      line-height: 48px;
      letter-spacing: -0.32px;
      max-width: 450px;
    }
    .footer-blurb .dim { color: #8a8a8a; }
    .footer-email-wrap { display: inline-block; position: relative; margin-top: 28px; }
    .footer-email {
      font-size: 29.6px;
      font-weight: 200;
      line-height: 48px;
      letter-spacing: -0.32px;
      color: #fff;
      transition: opacity 0.18s;
    }
    .footer-email:hover { opacity: 0.6; }
    .footer-email-line {
      position: absolute;
      bottom: 4px;
      left: 0;
      width: 15%;
      height: 2px;
      background: #fff;
    }

    /* ─── RESPONSIVE ────────────────────────────────── */
    @media (min-width: 1900px) {
      .nav-inner { padding-left: calc(32px + (100% - 1728px) / 2); padding-right: calc(32px + (100% - 1728px) / 2); }
    }

    @media (hover: none), (pointer: coarse) {
      #custom-cursor { display: none; }
      html, body, *, *::before, *::after { cursor: auto !important; }
    }

    /* ── Tablet: ≤ 1100px ── */
    @media (max-width: 1100px) {
      body { --gutter: 24px; }
      .nav-inner { padding: 14px 28px 18px; }

      .survey { padding: 60px calc(var(--gutter) + 41px) 80px; }
      .survey-head { font-size: 38px; line-height: 48px; }
      .survey-sub { font-size: 18px; line-height: 28px; }

      footer { height: auto; }
      .footer-inner { padding: 40px calc(var(--gutter) + 41px); }
      .footer-blurb, .footer-email { font-size: 22px; line-height: 36px; }
    }

    /* ── Mobile: ≤ 640px ── */
    @media (max-width: 640px) {
      body { --gutter: 14px; --nav-h: 44px; }
      .nav-inner { padding: 12px 20px; }
      .nav-logo img { height: 16px; }

      .survey { padding: 44px calc(var(--gutter) + 21px) 56px; }
      .survey-head { font-size: 28px; line-height: 38px; max-width: 100%; margin-bottom: 16px; }
      .survey-sub { font-size: 16px; line-height: 26px; max-width: 100%; margin-bottom: 40px; }

      footer { height: auto; }
      .footer-inner { padding: 32px calc(var(--gutter) + 21px); gap: 32px; }
      .footer-blurb { font-size: 18px; line-height: 28px; max-width: 100%; }
      .footer-email { font-size: 18px; line-height: 28px; }

      .outline {
        -webkit-text-stroke-width: 0.3px;
        text-stroke-width: 0.3px;
      }
    }
  </style>
</head>
<body>
<div id="custom-cursor"></div>

  <!-- ─── NAVBAR ─── -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <img src="images/logo/ImageLogo.svg" alt="Patina">
      </a>
    </div>
  </nav>

  <div class="page">

    <!-- ─── SURVEY ─── -->
    <section class="survey">
      <h1 class="survey-head reveal">Book a call <span class="outline">with Patina.</span></h1>
      <p class="survey-sub reveal" style="--reveal-delay: 0.15s">Pick a time that works for you and we'll get you set up with the right designer.</p>
      <div class="survey-embed reveal" style="--reveal-delay: 0.3s">
        <iframe src="https://api.leadconnectorhq.com/widget/booking/s6fbtm2E1dzqT2GO0dIV" style="border:none;width:100%;" scrolling="no" id="s6fbtm2E1dzqT2GO0dIV" title="booking"></iframe>
        <script src="https://link.msgsndr.com/js/form_embed.js"></script>
      </div>
    </section>

    <!-- ─── FOOTER ─── -->
    <footer>
      <div class="footer-inner">
        <a href="index.html" class="footer-logo">
          <img src="images/logo/ImageLogo.svg" alt="Patina">
        </a>
        <div>
          <p class="footer-blurb">
            Backing great founders?
            <span class="dim"> Let's make sure their product looks the part.</span>
          </p>
          <div class="footer-email-wrap">
            <a href="mailto:sreeni@patinaex.com" class="footer-email">sreeni@patinaex.com</a>
            <div class="footer-email-line"></div>
          </div>
        </div>
      </div>
    </footer>

  </div><!-- /.page -->

  <script>
    /* ── Scroll reveal ── */
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    /* ── Custom cursor ── */
    const cursor = document.getElementById('custom-cursor');
    document.addEventListener('mousemove', e => {
      cursor.style.left = e.clientX + 'px';
      cursor.style.top  = e.clientY + 'px';
    });
    document.querySelectorAll('footer').forEach(sec => {
      sec.addEventListener('mouseenter', () => cursor.classList.add('on-dark'));
      sec.addEventListener('mouseleave', () => cursor.classList.remove('on-dark'));
    });

    /* ── Page transitions (skip anchors, mail, external) ── */
    document.querySelectorAll('a[href]').forEach(link => {
      const href = link.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('mailto') || href.startsWith('http')) return;
      link.addEventListener('click', e => {
        e.preventDefault();
        document.body.classList.add('fade-out');
        setTimeout(() => { window.location.href = href; }, 260);
      });
    });
  </script>

</body>
</html>
